name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate release version
        run: node scripts/check-release.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check generated product pages
        run: npm run check:site

      - name: Build and test
        run: npm test

      - name: Package the extension
        run: python3 build.py

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_path="artifacts/${package_name}-${RELEASE_TAG#v}.zip"
          is_draft="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")"
          case "$is_draft" in
            true)
              gh release upload "$RELEASE_TAG" "$package_path" \
                --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
              ;;
            "")
              gh release create "$RELEASE_TAG" "$package_path" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --draft \
                --target "$GITHUB_SHA" \
                --generate-notes \
                --title "Aside ${RELEASE_TAG#v}"
              ;;
            *)
              echo "::error::Release $RELEASE_TAG is already published; use a new version."
              exit 1
              ;;
          esac
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,targetCommitish,url
